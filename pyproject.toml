[project]
name = "projeto-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evaldo", email = "evaldoazeredoc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arfs>=3.0.0",
    "catboost>=1.2.10",
    "jupyter>=1.1.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
projeto-ml = "projeto_ml:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
